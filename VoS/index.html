<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessels of Sanctuary - Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        /* Cooldown Indicator Styles */
        #cooldown-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            border: 3px solid #636e72;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Crucial for the wipe effect */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #cooldown-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            /* Start it offscreen at the bottom */
            transform: translateY(100%); 
        }
        #cooldown-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
            z-index: 2;
            text-shadow: 1px 1px 3px #000;
        }
        /* Stats Display Styles */
        #stats-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 14px;
            width: 200px;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        /* Pause Menu Styles */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            z-index: 1000;
        }
        #pause-menu h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        #resume-button {
            padding: 10px 20px;
            font-size: 24px;
            background-color: #0984e3;
            border: none;
            color: white;
            cursor: pointer;
        }
        /* Minimap */
        #minimap-canvas {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            background-color: rgba(0,0,0,0.6);
            z-index: 500;
        }
    </style>
    <style>
        /* Character Selection Screen */
        #character-selection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #selection-title {
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
        }

        #character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 800px;
        }

        .character-card {
            width: 150px;
            height: 200px;
            background-color: #2d3436;
            border: 2px solid #636e72;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .character-card:hover {
            transform: scale(1.05);
            border-color: #b2bec3;
        }
        .character-card.selected {
            border-color: #00cec9;
            box-shadow: 0 0 15px #00cec9;
        }

        .character-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            margin-top: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .character-name {
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .character-type {
            color: #b2bec3;
            font-size: 14px;
        }

        #start-game-btn {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 24px;
            background-color: #2d3436; /* Disabled color */
            color: #636e72;
            border: none;
            border-radius: 5px;
            cursor: not-allowed;
            transition: background-color 0.3s;
        }
        #start-game-btn.active {
            background-color: #00cec9;
            color: white;
            cursor: pointer;
        }
        #start-game-btn.active:hover {
            background-color: #01a3a4;
        }
    </style>
</head>
<body>
    <!-- Character Selection Screen -->
    <div id="character-selection-screen">
        <h1 id="selection-title">Select Your Squad (Pick 2)</h1>
        <div id="character-grid">
            <!-- Cards will be injected by JS -->
        </div>
        <button id="start-game-btn">Start Game</button>
    </div>

    <!-- The canvas element where the game will be rendered -->
    <canvas id="game-canvas"></canvas>

    <!-- The UI element for the swap cooldown -->
    <div id="cooldown-container" style="display: none;">
        <div id="cooldown-fill"></div>
        <div id="cooldown-text">SHIFT</div>
    </div>

    <!-- The UI element for the stats display -->
    <div id="stats-container" style="display: none;">
        <div class="stat-line">
            <span>Level:</span>
            <span id="stat-level">1</span>
        </div>
        <div class="stat-line">
            <span>Health:</span>
            <span id="stat-health">0 / 0</span>
        </div>
        <div class="stat-line">
            <span>Mana:</span>
            <span id="stat-mana">0 / 0</span>
        </div>
        <div class="stat-line">
            <span>Attack Damage:</span>
            <span id="stat-ad">0</span>
        </div>
        <div class="stat-line">
            <span>Armor:</span>
            <span id="stat-armor">0</span>
        </div>
    </div>

    <!-- Minimap -->
    <canvas id="minimap-canvas" width="200" height="200" style="display:none;"></canvas>

    <!-- Import Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Import our custom game scripts as modules -->
    <script type="module" src="main.js"></script>

    <!-- Pause Menu Overlay -->
    <div id="pause-menu">
        <h1>Paused</h1>
        <button id="resume-button">Resume</button>
    </div>
</body>
</html>
