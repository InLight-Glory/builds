<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessels of Sanctuary - Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        /* Cooldown Indicator Styles */
        #cooldown-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            border: 3px solid #636e72;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Crucial for the wipe effect */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #cooldown-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            /* Start it offscreen at the bottom */
            transform: translateY(100%); 
        }
        #cooldown-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
            z-index: 2;
            text-shadow: 1px 1px 3px #000;
        }
        /* Stats Display Styles */
        #stats-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 14px;
            width: 200px;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        /* Pause Menu Styles */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            z-index: 1000;
        }
        #pause-menu h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        #resume-button {
            padding: 10px 20px;
            font-size: 24px;
            background-color: #0984e3;
            border: none;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- The canvas element where the game will be rendered -->
    <canvas id="game-canvas"></canvas>

    <!-- The UI element for the swap cooldown -->
    <div id="cooldown-container">
        <div id="cooldown-fill"></div>
        <div id="cooldown-text">SHIFT</div>
    </div>

    <!-- The UI element for the stats display -->
    <div id="stats-container">
        <div class="stat-line">
            <span>Level:</span>
            <span id="stat-level">1</span>
        </div>
        <div class="stat-line">
            <span>Health:</span>
            <span id="stat-health">0 / 0</span>
        </div>
        <div class="stat-line">
            <span>Mana:</span>
            <span id="stat-mana">0 / 0</span>
        </div>
        <div class="stat-line">
            <span>Attack Damage:</span>
            <span id="stat-ad">0</span>
        </div>
        <div class="stat-line">
            <span>Armor:</span>
            <span id="stat-armor">0</span>
        </div>
    </div>

    <!-- Import Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Import our custom game scripts as modules -->
    <script type="module" src="main.js"></script>

    <!-- Pause Menu Overlay -->
    <div id="pause-menu">
        <h1>Paused</h1>
        <button id="resume-button">Resume</button>
    </div>
</body>
</html>
